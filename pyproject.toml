[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars_bt"
description = "Rust-backed Polars expression plugins for T0 and cross-sectional backtesting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = [
  "polars>=2.0.0,<2.1.0; python_version < '3.11'",
  "polars>=2.0.0,<2.2.0; python_version >= '3.11'",
]

[project.urls]
Repository = "https://github.com/huangbogeng/polars_bt_extension"
Issues = "https://github.com/huangbogeng/polars_bt_extension/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.maturin]
module-name = "polars_bt._internal"

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true
