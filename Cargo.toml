[package]
name = "polars_bt"
version = "0.2.0"
edition = "2021"

[lib]
name = "polars_bt"
crate-type = ["cdylib"]


[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py39"] }
pyo3-polars = { version = "0.27.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.54.4", default-features = false, features = [
    "dtype-datetime",
    "dtype-struct",
    "dtype-u8",
] }
chrono = "0.4.42"
