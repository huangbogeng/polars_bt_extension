[package]
name = "polars_bt"
version = "0.2.1"
edition = "2021"
description = "Rust-backed Polars expression plugins for T0 and cross-sectional backtesting"
license = "MIT"
repository = "https://github.com/huangbogeng/polars_bt_extension"
readme = "README.md"

[lib]
name = "polars_bt"
crate-type = ["cdylib"]


[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py310"] }
pyo3-polars = { version = "0.27.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.54.4", default-features = false, features = [
    "dtype-datetime",
    "dtype-struct",
    "dtype-u8",
] }
polars-config = "0.54.4"
chrono = "0.4.42"
