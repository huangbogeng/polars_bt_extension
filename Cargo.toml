[package]
name = "polars_bt"
version = "0.1.2"
edition = "2021"

[lib]
name = "polars_bt"
crate-type = ["cdylib"]


[dependencies]
# PyO3
# numpy = "0.26"                                                            # matrix interop
pyo3 = {version = "0.26", features = ["abi3-py39", "extension-module"]}
pyo3-polars = {version = "0.25", features = ["derive", "lazy"]} 
# Serialization
serde = {version = "*", features=["derive"]}
# polars
polars = { version = "0.52.0", features = [
    "lazy",
    "diff",
    "array_count",
    "abs",
    "cross_join",
    "rank",
    "log",
    "cum_agg",
    "round_series",
    "chunked_ids",
    "performant",
    "dtype-datetime",
    "timezones",
], default-features = false }

chrono = "0.4.42"
