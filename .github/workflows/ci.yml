name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  MATURIN_VERSION: v1.12.6
  PYTEST_VERSION: 9.0.2
  RUFF_VERSION: 0.15.22
  UV_VERSION: 0.10.7

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.10 for Rust tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Configure PyO3 test linking
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "PYO3_PYTHON=$(command -v python)" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --package polars_bt --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run Ruff
        run: uvx "ruff==${RUFF_VERSION}" check polars_bt tests benchmarks examples

      - name: Check Python formatting
        run: uvx "ruff==${RUFF_VERSION}" format --check polars_bt tests benchmarks examples

  build-wheel:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build manylinux2014 x86_64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64
          manylinux: "2014"
          command: build
          args: >-
            --release --locked --out dist
            --interpreter /opt/python/cp310-cp310/bin/python
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  python-test:
    name: Python ${{ matrix.python-version }} / Polars ${{ matrix.polars-version }}
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        polars-version: ["1.44.2", "1.44.*"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-wheel
          path: dist

      - name: Install wheel and test dependency
        run: uv pip install --system --force-reinstall dist/*.whl "polars==${{ matrix.polars-version }}" "pytest==${PYTEST_VERSION}"

      - name: Stage tests outside the source checkout
        run: cp -R tests "${RUNNER_TEMP}/tests"

      - name: Run Python tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest tests -q
