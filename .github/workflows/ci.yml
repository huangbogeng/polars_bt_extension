name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  MATURIN_VERSION: v1.12.6
  PYTEST_VERSION: 9.0.2
  RUFF_VERSION: 0.15.22
  UV_VERSION: 0.10.7

jobs:
  lint:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint
      - name: Check workflow syntax with pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check formatting and Python lint
        run: |
          cargo fmt --all -- --check
          uvx "ruff==${RUFF_VERSION}" check polars_bt tests benchmarks examples tools
          uvx "ruff==${RUFF_VERSION}" format --check polars_bt tests benchmarks examples tools
      - name: Test release artifact verification
        run: uv run --no-project --python 3.12 --with "pytest==${PYTEST_VERSION}" python -m pytest tools/tests -q

  rust:
    name: Rust checks
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Configure PyO3 test linking
        run: |
          python_libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "PYO3_PYTHON=$(command -v python)" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${python_libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
          components: clippy
      - name: Restore native dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: native-checks-v1
      - name: Run Clippy and Rust tests
        run: |
          cargo clippy --locked --package polars_bt --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets

  build-distributions:
    name: Build distributions
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build manylinux2014 x86_64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64
          manylinux: "2014"
          rust-toolchain: "1.95"
          command: build
          args: >-
            --release --locked --out dist
            --interpreter /opt/python/cp310-cp310/bin/python
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: true
      - name: Build source distribution
        # The preceding container exports RUSTC_WRAPPER, but its sccache binary
        # is not installed on the host used for Cargo metadata during sdist.
        env:
          RUSTC_WRAPPER: ""
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  python-test:
    name: Python ${{ matrix.python-version }} / Polars ${{ matrix.polars-version }}
    needs: build-distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        polars-version: ["2.0.0", "2.0.*", "2.1.0", "2.1.*"]
        exclude:
          - python-version: "3.10"
            polars-version: "2.1.0"
          - python-version: "3.10"
            polars-version: "2.1.*"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}-polars-${{ matrix.polars-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Install wheel and test dependency
        run: uv pip install --system --force-reinstall dist/*.whl "polars==${{ matrix.polars-version }}" "pytest==${PYTEST_VERSION}"
      - name: Stage tests outside the source checkout
        run: cp -R tests "${RUNNER_TEMP}/tests"
      - name: Run Python tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest tests -q

  verify-distributions:
    name: Verify distributions
    needs: [rust, build-distributions, python-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: verified
      - name: Verify distributions and record provenance
        run: >-
          python tools/ci_release.py create --directory verified
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: verified/
          if-no-files-found: error
          retention-days: 30

  required:
    name: CI gate
    if: always()
    needs: [lint, rust, build-distributions, python-test, verify-distributions]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required stages did not succeed: {failed}")
          print("All required stages passed")
          PY
