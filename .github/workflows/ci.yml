name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies with uv
      run: uv pip install --system maturin 'polars>=1.43,<1.44' pytest ruff

    - name: Run rustfmt
      run: cargo +nightly fmt --all -- --check

    - name: Run clippy
      run: cargo +nightly clippy --package polars_bt --all-targets --all-features -- -D warnings

    - name: Run Rust tests
      run: cargo +nightly test --all-targets

    - name: Build wheels with maturin
      run: maturin build --release --out dist

    - name: Install wheels with uv
      run: uv pip install --system dist/*.whl --force-reinstall

    - name: Run Python tests
      run: python -m pytest tests -q

    - name: Run Ruff
      run: python -m ruff check polars_bt tests benchmarks
