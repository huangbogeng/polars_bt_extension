name: Release

on:
  release:
    types: [published]
  # A main-branch dispatch exercises promotion without uploading to PyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  artifacts:
    name: Select verified main distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main for a manual rehearsal
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release rehearsal from main"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select successful CI for the exact release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            args=(--tag "$RELEASE_TAG")
          fi
          python tools/ci_release.py select \
            --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" "${args[@]}"
      - name: Download the verified artifact from that CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verified
          merge-multiple: true
      - name: Verify provenance and select only distribution files
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: >-
          python tools/ci_release.py verify --directory verified --output upload
          --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT"
          --run-id "$SOURCE_RUN" --run-attempt "$SOURCE_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Publish the exact distributions verified by main CI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          verbose: true
